---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% include meta.html %}
  </header>
  
  <div class="post-body">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
    <footer class="post-footer">
      <div class="post-tags">
        <i class="fas fa-tags"></i>
        {% for tag in page.tags %}
          <span class="tag-badge">{{ tag }}</span>
        {% endfor %}
      </div>
    </footer>
  {% endif %}
</article>
